name: NaniLabs CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # HIVE - Next.js App
  hive:
    name: HIVE (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hive-app
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hive-app/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint || true
      
      - name: Build
        run: npm run build
      
      - name: Run tests
        run: npm test || true

  # AURA Infra - FastAPI
  aura-infra:
    name: AURA Infra (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura-infra
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Run tests
        run: |
          cd src
          python -c "from database import init_db; import asyncio; asyncio.run(init_db())"
          pytest ../tests/ -v || true
      
      - name: Check API starts
        run: |
          cd src
          timeout 10 python -m uvicorn api:app --port 8001 &
          sleep 5
          curl -f http://localhost:8001/health || exit 1

  # NEXUS Mail - FastAPI
  nexus-mail:
    name: NEXUS Mail (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-mail
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      
      - name: Check API starts
        run: |
          cd src
          timeout 10 python -m uvicorn api:app --port 8002 &
          sleep 5
          curl -f http://localhost:8002/health || exit 1

  # E2E Tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [hive, aura-infra, nexus-mail]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install HIVE
        working-directory: hive-app
        run: npm ci
      
      - name: Install Playwright
        working-directory: hive-app
        run: npx playwright install --with-deps chromium
      
      - name: Install Python deps
        run: |
          pip install -r aura-infra/requirements.txt
          pip install -r nexus-mail/requirements.txt
      
      - name: Start services
        run: |
          # Start AURA Infra
          cd aura-infra/src && python -m uvicorn api:app --port 8001 &
          # Start NEXUS Mail
          cd nexus-mail/src && python -m uvicorn api:app --port 8002 &
          # Start HIVE
          cd hive-app && npm run dev &
          # Wait for services
          sleep 15
      
      - name: Run E2E tests
        working-directory: hive-app
        run: npx playwright test --reporter=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: hive-app/playwright-report/
          retention-days: 7

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build AURA Infra
        run: docker build -t nanilabs/aura-infra:latest ./aura-infra
      
      - name: Build NEXUS Mail
        run: docker build -t nanilabs/nexus-mail:latest ./nexus-mail
