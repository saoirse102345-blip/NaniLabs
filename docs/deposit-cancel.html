<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Cancelled - AURA Wallet | NaniLabs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 25px;
        }
        h1 {
            color: #fbbf24;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        p {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #8b5cf6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #7c3aed;
        }
        .secondary-link {
            display: block;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
        }
        .secondary-link:hover {
            text-decoration: underline;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>Deposit Cancelled</h1>
        <p>Your payment was cancelled. No charges have been made to your card.</p>
        
        <a href="/deposit.html" class="btn">Try Again</a>
        <a href="/" class="secondary-link">← Back to NaniLabs</a>
    </div>
</body>
</html>
